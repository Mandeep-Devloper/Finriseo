# CI gate: schema-validate → typecheck → lint → tests → build, plus a
# non-blocking dependency audit. Fails fast on the first broken step. No secrets
# are needed: server env validation is lazy (src/lib/env.ts) and firebase/prisma
# init lazily, so `next build` succeeds with no env vars — verified with .env absent.
#
# Note: this intentionally runs `next build` directly, NOT `npm run build` —
# the package script also runs `prisma migrate deploy`, which needs the real
# database and belongs to deploys (Vercel), not CI.
name: CI

on:
  push:
  pull_request:

# A PR from a branch in this repo triggers both push and pull_request; cancel
# the superseded run instead of burning minutes twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`, so the client types exist for tsc.
      - name: Install dependencies
        run: npm ci

      # Catch schema/migration mistakes (invalid types, relations) before typecheck.
      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx next build

      # Fail the build on any HIGH/critical PRODUCTION advisory. The tree is clean
      # of highs (Next.js patched to 15.5.21; postcss/sharp/fast-uri/fast-xml-parser
      # pinned to fixed versions via package.json "overrides"). The only remaining
      # advisories are MODERATE and live solely in firebase-admin's
      # @google-cloud/storage & @google-cloud/firestore chains, which this app never
      # invokes (auth-only usage) — npm's only "fix" for them is a breaking
      # firebase-admin downgrade, so they are accepted rather than failed on.
      - name: Dependency audit (fail on high)
        run: npm audit --omit=dev --audit-level=high
